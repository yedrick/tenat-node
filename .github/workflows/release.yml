name: Release

# Con changesets pendientes abre (o actualiza) un PR "Version packages". Al hacer merge de ese
# PR, publica en npm los paquetes con versión nueva, con provenance.
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # provenance de npm

jobs:
  release:
    runs-on: ubuntu-latest
    # Sin el secreto NPM_TOKEN (todavía no hay cuenta en npm) no hace nada: los paquetes se
    # distribuyen por GitHub Releases (github-release.yml).
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - if: env.HAS_NPM_TOKEN != 'true'
        run: echo "Sin NPM_TOKEN; no se publica en npm."
      - if: env.HAS_NPM_TOKEN == 'true'
        uses: actions/checkout@v4
      - if: env.HAS_NPM_TOKEN == 'true'
        uses: pnpm/action-setup@v4
      - if: env.HAS_NPM_TOKEN == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - if: env.HAS_NPM_TOKEN == 'true'
        run: pnpm install --frozen-lockfile
      - if: env.HAS_NPM_TOKEN == 'true'
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm release
          title: 'Version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
